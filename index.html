<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4EC8C8" />
    <meta name="author" content="Marine Junca" />
    <!--
      Titre, description, canonical, Open Graph et données structurées propres à chaque page :
      injectés ici au build par scripts/prerender.mjs à partir de src/seo/routes.ts.
    -->
    <!--seo-head-->

    <!--
      Google n'affiche le favicon dans ses résultats que si l'icône est carrée
      et d'une taille multiple de 48 px.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
